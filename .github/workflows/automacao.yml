name: Automacao Maquina de Leads

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/automacao.yml']

permissions:
  contents: read

concurrency:
  group: maquina-1-fila
  cancel-in-progress: false

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install requests supabase ddgs pypdf lxml
      - name: Verificar extracao e fila antes da captura
        run: python -m unittest discover -p 'test_*.py'
      - name: Executar automacao
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u scraper.py
