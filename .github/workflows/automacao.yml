name: Automacao Maquina de Leads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['*.py', 'requirements.txt', '.github/workflows/automacao.yml']
  schedule:
    - cron: '*/20 * * * *'
permissions:
  contents: read

concurrency:
  group: maquina-1-fila
  cancel-in-progress: true

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Verificar extracao e fila antes da captura
        id: validacao
        run: python -m unittest discover -p 'test_*.py'
      - name: Executar captura com prazo e deduplicação em memória
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          M1_INSTITUICAO_PILOTO: Universidade Federal da Bahia
        run: python -u scraper.py
