name: Diagnosticar buscadores no GitHub
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/diagnosticar_buscadores.py', '.github/workflows/diagnosticar_buscadores.yml']
permissions:
  contents: read
concurrency:
  group: maquina-1-fila
  cancel-in-progress: false
jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -p 'test_*.py'
      - run: python -u scripts/diagnosticar_buscadores.py
