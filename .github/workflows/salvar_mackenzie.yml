name: Salvar alunos conferidos da Mackenzie
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/salvar_mackenzie_conferidos.py'
      - '.github/workflows/salvar_mackenzie.yml'
permissions:
  contents: read
concurrency:
  group: maquina-1-fila
  cancel-in-progress: false
jobs:
  salvar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase ddgs pypdf lxml
      - run: python -m unittest discover -p 'test_*.py'
      - name: Salvar nomes conferidos e confirmar duplicacao
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u scripts/salvar_mackenzie_conferidos.py
