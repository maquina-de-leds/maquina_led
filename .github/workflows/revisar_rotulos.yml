name: Revisar rotulos comprovados
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/corrigir_rotulos_comprovados.py', '.github/workflows/revisar_rotulos.yml']
permissions:
  contents: read
concurrency:
  group: maquina-1-fila
  cancel-in-progress: false
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase ddgs pypdf lxml
      - run: python -m unittest discover -p 'test_*.py'
      - run: python -u scripts/corrigir_rotulos_comprovados.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
