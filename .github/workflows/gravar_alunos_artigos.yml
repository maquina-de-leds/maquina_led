name: Gravar alunos encontrados em artigos
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maquina-1-fila
  cancel-in-progress: false
jobs:
  gravar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -p 'test_*.py'
      - name: Conferir PDF, salvar aluno e testar duplicacao
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u scripts/gravar_alunos_artigos.py
