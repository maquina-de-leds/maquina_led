name: Validar gravacao de leads reais
on:
  push:
    branches: [validacao-fontes-v58]
    paths: ['validar_gravacao_real.py', '.github/workflows/validar_gravacao.yml']
permissions:
  contents: read
concurrency:
  group: maquina-1-fila
  cancel-in-progress: false
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase pypdf
      - run: python -m unittest discover -p 'test_*.py'
      - name: Salvar e conferir lote com periodo explicito
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u validar_gravacao_real.py
