name: Verificar deduplicação real sem instituição
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verificar_deduplicacao_real.py'
      - '.github/workflows/verificar_deduplicacao_real.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maquina-1-fila
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase ddgs pypdf lxml
      - name: Confirmar duplicação na função principal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u scripts/verificar_deduplicacao_real.py
