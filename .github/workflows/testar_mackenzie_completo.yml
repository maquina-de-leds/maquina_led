name: Validar lote Mackenzie e banco
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/testar_mackenzie_completo.py'
      - '.github/workflows/testar_mackenzie_completo.yml'
permissions:
  contents: read
concurrency:
  group: maquina-1-fila
  cancel-in-progress: true
jobs:
  salvar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase ddgs pypdf lxml
      - run: python -m unittest discover -p 'test_*.py'
      - name: Ler quatro fontes, salvar e confirmar duplicação
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u scripts/testar_mackenzie_completo.py
