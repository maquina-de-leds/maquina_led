name: Teste real de captura e gravacao
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/testar_captura_real.py'
      - '.github/workflows/testar_captura_real.yml'
permissions:
  contents: read
concurrency:
  group: maquina-1-fila
  cancel-in-progress: false
jobs:
  piloto:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase ddgs pypdf
      - run: python -m unittest discover -p 'test_*.py' -v
      - name: Buscar candidatos reais e gravar sem concluir fila nacional
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scripts/testar_captura_real.py
