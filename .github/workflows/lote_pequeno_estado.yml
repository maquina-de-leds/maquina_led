name: Lote pequeno real Santa Catarina
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: maquina-1-fila
  cancel-in-progress: false
jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Verificar captura, deduplicação e retomada
        run: python -m unittest discover -p 'test_*.py'
      - name: Capturar duas faculdades e preservar pesquisas restantes
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u scripts/lote_pequeno_estado.py
