name: Carregar lista validada de faculdades
on:
  push:
    branches: [validacao-fontes-v58]
    paths: ['carregar_fila_validada.py', '.github/workflows/carregar_fila_validada.yml']
permissions:
  contents: read
concurrency:
  group: maquina-1-fila
  cancel-in-progress: false
jobs:
  carregar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests supabase pypdf
      - uses: actions/cache@v4
        with:
          path: cache_inep
          key: cadastros-inep-2024-v1
      - run: python -m unittest discover -p 'test_*.py'
      - name: Carregar e conferir fila nacional
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          INEP_CADASTROS_PATH: cache_inep/cadastros_2024.zip
        run: python -u carregar_fila_validada.py
