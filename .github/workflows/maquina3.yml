name: Maquina 3 - listas publicas de formandos

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maquina-3-lotes-formandos
  cancel-in-progress: false

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Testar filtros, limite e isolamento de fontes
        run: python -m unittest discover -p 'test_*.py'
      - name: Executar Máquina 3
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python -u maquina3.py
