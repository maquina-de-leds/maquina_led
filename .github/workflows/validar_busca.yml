name: Validar descoberta web
on:
  push:
    branches: [validacao-fontes-v58]
    paths: ['validar_busca_real.py', '.github/workflows/validar_busca.yml']
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests ddgs pypdf
      - name: Pesquisar fontes sem gravar no banco
        run: python -u validar_busca_real.py
