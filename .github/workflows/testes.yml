name: Testes de qualificacao de leads

on:
  push:
    paths:
      - 'scraper.py'
      - 'fontes_academicas.py'
      - 'enriquecimento.py'
      - 'colecoes_academicas.py'
      - 'requirements.txt'
      - 'tests/fixtures/**'
      - 'migrations/**'
      - 'test_*.py'
      - '.github/workflows/testes.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: teste_local
          POSTGRES_DB: auditoria_testes
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias fixadas
        run: pip install -r requirements.txt
      - name: Validar qualificacao e retomada sem acesso ao Supabase
        env:
          PG_TEST_DSN: postgresql://postgres:teste_local@127.0.0.1:5432/auditoria_testes
        run: python -m unittest discover -p 'test_*.py' -v
